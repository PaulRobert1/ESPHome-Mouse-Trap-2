esphome:
  name: mousetrap2
  friendly_name: MouseTrap2

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  - id: mouse_count
    type: int
    restore_value: yes
    initial_value: '0'

  - id: servo_stop_val
    type: float
    initial_value: '0.075'

  # 0 = idle
  # 1 = running, waiting for limit release
  # 2 = running, stop on next limit press
  - id: trap_state
    type: int
    initial_value: '0'

  - id: run_ticks
    type: int
    initial_value: '0'

  # blocks retrigger until touch is released
  - id: trigger_armed
    type: bool
    initial_value: 'true'

esp32_touch:
  setup_mode: False

captive_portal:

output:
  - platform: ledc
    id: servo_output
    pin: GPIO15
    frequency: 50Hz

script:
  - id: servo_run_forward
    mode: restart
    then:
      # If wrong direction, change +0.05 to -0.05
      - output.set_level:
          id: servo_output
          level: !lambda 'return id(servo_stop_val) + 0.05;'

  - id: servo_stop_now
    mode: restart
    then:
      # brief reverse pulse to reduce overshoot
      - output.set_level:
          id: servo_output
          level: !lambda 'return id(servo_stop_val) - 0.01;'
      - delay: 100ms
      - output.set_level:
          id: servo_output
          level: !lambda 'return id(servo_stop_val);'

binary_sensor:
  - platform: esp32_touch
    name: "Mouse Trigger"
    id: mouse_touch
    pin: GPIO4
    threshold: 1020
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

    on_press:
      - if:
          condition:
            lambda: 'return id(trigger_armed);'
          then:
            - logger.log: "Touch triggered."
            - globals.set:
                id: trigger_armed
                value: 'false'
            - globals.set:
                id: run_ticks
                value: '0'
            - script.execute: servo_run_forward

            - if:
                condition:
                  binary_sensor.is_on: limit_switch
                then:
                  - logger.log: "Started while limit is pressed; waiting for release."
                  - globals.set:
                      id: trap_state
                      value: '1'
                else:
                  - logger.log: "Started; armed to stop on next limit press."
                  - globals.set:
                      id: trap_state
                      value: '2'

    on_release:
      - globals.set:
          id: trigger_armed
          value: 'true'

  - platform: gpio
    name: "Trap Limit Switch"
    id: limit_switch
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 1ms
      - delayed_off: 3ms

    on_release:
      - if:
          condition:
            lambda: 'return id(trap_state) == 1;'
          then:
            - logger.log: "Limit released; armed for next press."
            - globals.set:
                id: trap_state
                value: '2'

    on_press:
      - if:
          condition:
            lambda: 'return id(trap_state) == 2;'
          then:
            - logger.log: "Limit pressed. STOP."
            - globals.set:
                id: trap_state
                value: '0'
            - globals.set:
                id: run_ticks
                value: '0'
            - script.execute: servo_stop_now
            - globals.set:
                id: mouse_count
                value: !lambda 'return id(mouse_count) + 1;'

interval:
  - interval: 20ms
    then:
      - if:
          condition:
            lambda: 'return id(trap_state) == 1 || id(trap_state) == 2;'
          then:
            - globals.set:
                id: run_ticks
                value: !lambda 'return id(run_ticks) + 1;'

            - if:
                condition:
                  lambda: 'return id(run_ticks) > 600;'
                then:
                  - logger.log: "Failsafe stop (timeout)."
                  - globals.set:
                      id: trap_state
                      value: '0'
                  - globals.set:
                      id: run_ticks
                      value: '0'
                  - script.execute: servo_stop_now

sensor:
  - platform: template
    name: "Mice Caught"
    id: mice_caught_sensor
    icon: "mdi:counter"
    lambda: 'return id(mouse_count);'
    update_interval: 1s

switch:
  - platform: template
    name: "Manual Trigger (Test)"
    turn_on_action:
      - globals.set:
          id: run_ticks
          value: '0'
      - script.execute: servo_run_forward
      - if:
          condition:
            binary_sensor.is_on: limit_switch
          then:
            - globals.set:
                id: trap_state
                value: '1'
          else:
            - globals.set:
                id: trap_state
                value: '2'

    turn_off_action:
      - globals.set:
          id: trap_state
          value: '0'
      - globals.set:
          id: run_ticks
          value: '0'
      - script.execute: servo_stop_now

button:
  - platform: template
    name: "Reset Counter"
    on_press:
      - globals.set:
          id: mouse_count
          value: '0'
